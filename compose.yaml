# Local development database. Credentials here are throwaway defaults for a
# database bound to localhost; never reuse them for a shared environment.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chalkline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chalkline}
      POSTGRES_DB: ${POSTGRES_DB:-chalkline}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  db-data:
